# Optional Qdrant server for deployments that outgrow embedded local mode.
# Usage: docker compose -f docker-compose.qdrant.yml up -d
# Point rag-aio at it with: [rag.db_handler.vector_store] mode = "server", url = "http://localhost:6333"
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
