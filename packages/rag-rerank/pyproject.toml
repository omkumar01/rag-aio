[project]
name = "rag-rerank"
version = "0.1.0"
description = "rag-aio second-stage relevance optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rag-core", "httpx>=0.27"]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_rerank"]
