[project]
name = "rag-retrieval"
version = "0.1.0"
description = "rag-aio retrieval engine: dense, sparse, hybrid, fusion, explainability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rag-core", "rag-db-handler", "numpy>=1.26", "bm25s>=0.2"]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_retrieval"]
