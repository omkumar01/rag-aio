[project]
name = "rag-embedder"
version = "0.1.0"
description = "rag-aio chunking, tokenization, embedding and indexing orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rag-core",
    "fastembed>=0.3",
    "tokenizers>=0.19",
    "numpy>=1.26",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_embedder"]
