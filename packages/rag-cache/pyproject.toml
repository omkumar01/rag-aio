[project]
name = "rag-aio-cache"
version = "0.1.1"
description = "rag-aio multi-level caching: memory, disk, sqlite backends"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["rag-aio-core"]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_cache"]
