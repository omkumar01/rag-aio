[project]
name = "rag-db-handler"
version = "0.1.0"
description = "rag-aio unified persistence: SQL, document, KV, vector, sparse, cache stores"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rag-core",
    "qdrant-client>=1.10",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
faiss = ["faiss-cpu>=1.8"]
pgvector = ["pgvector>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_db_handler"]
