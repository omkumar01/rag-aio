[project]
name = "rag-aio-llm-provider"
version = "0.1.1"
description = "rag-aio provider and model management control layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["rag-aio-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_llm_provider"]
