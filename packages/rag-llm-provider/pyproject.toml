[project]
name = "rag-llm-provider"
version = "0.1.0"
description = "rag-aio provider and model management control layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rag-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_llm_provider"]
