[project]
name = "rag-aio"
version = "0.1.1"
description = "rag-aio: asynchronous, modular RAG platform — facade, CLI, and all rag-aio packages in one distribution"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opentelemetry-api>=1.25",
    "tokenizers>=0.19",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "bm25s>=0.2",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
# Optional third-party backends. The wheel bundles all rag-aio packages' code;
# extras only add the heavy backend SDKs they can use.
qdrant = ["qdrant-client>=1.10"]
fastembed = ["fastembed>=0.3"]
sentence-transformers = ["sentence-transformers>=3.0"]
faiss = ["faiss-cpu>=1.8"]
postgres = ["asyncpg>=0.29"]
pgvector = ["pgvector>=0.3"]
redis = ["redis>=5.0"]
docling = ["docling>=2.0"]
msg = ["extract-msg>=0.50"]
rtf = ["striprtf>=0.0.26"]
pydantic-ai = ["pydantic-ai>=0.2"]
streamlit = ["streamlit>=1.37"]
all = [
    "qdrant-client>=1.10",
    "fastembed>=0.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "docling>=2.0",
    "extract-msg>=0.50",
    "striprtf>=0.0.26",
    "pydantic-ai>=0.2",
    "streamlit>=1.37",
]

[project.scripts]
rag-aio = "rag_aio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_aio"]

[tool.hatch.build.hooks.custom]
# Bundles the sibling workspace packages into the wheel (build_hook.py).
path = "build_hook.py"
