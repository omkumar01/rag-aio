[project]
name = "rag-aio"
version = "0.1.0"
description = "rag-aio: RAG facade, CLI, and service composition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rag-core",
    "pydantic>=2.7",
    "rag-cache",
    "rag-observe",
    "rag-db-handler",
    "rag-doc-handler",
    "rag-ocr",
    "rag-embedder",
    "rag-retrieval",
    "rag-rerank",
    "rag-query",
    "rag-context",
    "rag-llm-provider",
    "rag-generation",
    "rag-orchestrator",
    "rag-mass-inject",
    "rag-eval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
rag-aio = "rag_aio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_aio"]
