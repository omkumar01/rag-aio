[project]
name = "rag-orchestrator"
version = "0.1.0"
description = "rag-aio strategy and workflow-management orchestration layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rag-core",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rag-doc-handler",
    "rag-embedder",
    "rag-db-handler",
    "rag-retrieval",
    "rag-rerank",
    "rag-query",
    "rag-context",
    "rag-generation",
    "rag-llm-provider",
    "rag-cache",
    "rag-observe",
]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai>=0.2"]
fastapi = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_orchestrator"]
