[project]
name = "rag-ui"
version = "0.1.0"
description = "rag-aio Streamlit management and experimentation console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rag-core", "streamlit>=1.37", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ui"]
