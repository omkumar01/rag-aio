[project]
name = "rag-context"
version = "0.1.0"
description = "rag-aio context engineering: token budgets, dedup, expansion, citations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rag-core", "tokenizers>=0.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_context"]
