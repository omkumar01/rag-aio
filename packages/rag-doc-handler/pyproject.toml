[project]
name = "rag-aio-doc-handler"
version = "0.1.0"
description = "rag-aio unified document ingestion and parsing layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rag-aio-core",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
msg = ["extract-msg>=0.50"]
rtf = ["striprtf>=0.0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_doc_handler"]
