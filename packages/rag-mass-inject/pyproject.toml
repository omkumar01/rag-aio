[project]
name = "rag-aio-mass-inject"
version = "0.1.0"
description = "rag-aio high-throughput bulk ingestion with checkpoints and backpressure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rag-aio-core",
    "rag-aio-doc-handler",
    "rag-aio-ocr",
    "rag-aio-embedder",
    "rag-aio-db-handler",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
test = [
    "rag-aio-cache",
    "rag-aio-retrieval",
    "rag-aio-rerank",
    "rag-aio-context",
    "rag-aio-query",
    "rag-aio-llm-provider",
    "rag-aio-orchestrator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mass_inject"]
