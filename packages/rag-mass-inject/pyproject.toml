[project]
name = "rag-mass-inject"
version = "0.1.0"
description = "rag-aio high-throughput bulk ingestion with checkpoints and backpressure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rag-core",
    "rag-doc-handler",
    "rag-ocr",
    "rag-embedder",
    "rag-db-handler",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
test = [
    "rag-cache",
    "rag-retrieval",
    "rag-rerank",
    "rag-context",
    "rag-query",
    "rag-llm-provider",
    "rag-orchestrator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mass_inject"]
