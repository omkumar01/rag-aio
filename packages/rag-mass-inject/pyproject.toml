[project]
name = "rag-mass-inject"
version = "0.1.0"
description = "rag-aio high-throughput bulk ingestion with checkpoints and backpressure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rag-core",
    "rag-doc-handler",
    "rag-ocr",
    "rag-embedder",
    "rag-db-handler",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mass_inject"]
