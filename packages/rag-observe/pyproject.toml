[project]
name = "rag-aio-observe"
version = "0.1.1"
description = "rag-aio observability: OpenTelemetry spans/metrics, redacted logging"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["rag-aio-core", "opentelemetry-api>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_observe"]
