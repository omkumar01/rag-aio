[project]
name = "rag-ocr"
version = "0.1.0"
description = "rag-aio hybrid mechanical + semantic OCR with provenance-preserving regions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rag-core", "numpy>=1.26", "pillow>=10.0", "httpx>=0.27"]

[project.optional-dependencies]
rapidocr = ["rapidocr-onnxruntime>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ocr"]
