[project]
name = "rag-aio-generation"
version = "0.1.1"
description = "rag-aio provider-agnostic LLM generation layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["rag-aio-core", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_generation"]
