{% extends "base.html" %}
{% block title %}Sign up — rag-aio{% endblock %}
{% block page_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create account</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="/signup" class="stack">
    <label>Username
      <input type="text" name="username" required autofocus minlength="3" maxlength="64"
             pattern="[A-Za-z0-9_\-]{3,64}" autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" class="btn btn-primary">Sign up</button>
  </form>
  <p class="auth-alt">Already registered? <a href="/login">Log in</a></p>
</section>
{% endblock %}
