<fieldset class="settings-fieldset">
  <legend>OCR (scanned pages)</legend>
  <div class="stack">
    <label>Engine
      <select name="ocr_engine">
        <option value="">— inherit —</option>
        {% for engine in ocr_engines %}
        <option value="{{ engine }}"{% if view.engine == engine %} selected{% endif %}>{{ engine }}</option>
        {% endfor %}
      </select>
    </label>
    <p class="muted">"vlm" escalates PDF pages with little machine text to an
      OpenAI-compatible vision endpoint. "none" skips OCR entirely.</p>
    <label>Vision endpoint URL
      <input type="text" name="ocr_base_url" value="{{ view.base_url }}" placeholder="http://localhost:1234/v1">
    </label>
    <label>Vision model
      <input type="text" name="ocr_model" value="{{ view.model }}" placeholder="glm-ocr">
    </label>
    <label>API key env var name
      <input type="text" name="ocr_api_key_ref" value="{{ view.api_key_ref_masked | default(view.api_key_ref, true) }}"
             placeholder="OCR_API_KEY">
    </label>
  </div>
</fieldset>
