<fieldset class="settings-fieldset">
  <legend>Storage &amp; database</legend>
  <div class="stack">
    <label>Qdrant local path
      <input type="text" name="qdrant_path" value="{{ view.qdrant_path }}" placeholder="./data/qdrant">
    </label>
    <label>…or Qdrant server URL
      <input type="text" name="qdrant_url" value="{{ view.qdrant_url }}" placeholder="http://localhost:6333">
    </label>
    <p class="muted settings-hint">Set a local path <em>or</em> a server URL — not both.</p>
    <label>Qdrant API key environment variable name
      <input type="text" name="qdrant_api_key_ref" value="{{ view.qdrant_api_key_ref }}" placeholder="QDRANT_API_KEY" autocomplete="off" spellcheck="false">
    </label>
    {% if view.qdrant_api_key_ref %}
    <p class="muted settings-hint">Saved reference: <code>{{ view.qdrant_api_key_ref_masked }}</code> — env-var name only, never a secret value.</p>
    {% endif %}
    <label>Document store DB URL
      <input type="text" name="db_url" value="{{ view.db_url }}" placeholder="sqlite+aiosqlite:///./data/rag.db" spellcheck="false">
    </label>
    <p class="muted settings-hint">Allowed schemes: {{ db_url_prefixes | join(", ") }}.</p>
    <label>Cache backend
      <select name="cache_backend">
        <option value="">— inherit —</option>
        {% for backend in cache_backends %}
        <option value="{{ backend }}"{% if view.cache_backend == backend %} selected{% endif %}>{{ backend }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Cache path
      <input type="text" name="cache_path" value="{{ view.cache_path }}" placeholder="./data/cache">
    </label>
  </div>
</fieldset>
