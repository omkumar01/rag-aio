name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy packages/*/src
        shell: bash

      - name: Tests
        run: uv run pytest -m "not integration and not e2e" --cov

      - name: Benchmark harness unit tests
        run: uv run pytest benchmarks -m unit

      - name: Read coverage total
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        id: coverage
        shell: bash
        run: echo "total=$(uv run coverage report --format=total)" >> "$GITHUB_OUTPUT"

      - name: Publish coverage commit status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/github-script@v7
        env:
          COVERAGE: ${{ steps.coverage.outputs.total }}
        with:
          script: |
            const coverage = process.env.COVERAGE.trim();
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'coverage',
              description: `coverage ${coverage}%`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
