name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Full quality gate
        run: uv run python scripts/check.py --fast
      - name: Build single rag-aio wheel
        # Wheel-only: the build hook bundles every workspace package's code
        # from sibling paths that only exist inside the repository tree.
        run: uv build --package rag-aio --wheel
      - name: Validate the wheel bundles every workspace package
        run: |
          uv run python - <<'EOF'
          import zipfile
          from pathlib import Path

          expected = {
              p.name.replace("-", "_")
              for p in Path("packages").iterdir()
              if (p / "pyproject.toml").is_file()
          }
          wheel = next(Path("dist").glob("rag_aio-*.whl"))
          bundled = {
              n.split("/")[0]
              for n in zipfile.ZipFile(wheel).namelist()
              if n.endswith(".py")
          }
          missing = expected - bundled
          if missing:
              raise SystemExit(f"wheel is missing bundled packages: {sorted(missing)}")
          print(f"OK: wheel bundles {len(bundled)} packages")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC); no API tokens
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
