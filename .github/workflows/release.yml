name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Full quality gate
        run: uv run python scripts/check.py --fast
      - name: Build all packages
        run: uv build --all-packages
      - name: Validate rag-aio extras cover the workspace
        # The rag-aio facade exposes one pip extra per workspace package plus
        # `all` (the facade itself and rag-ui are excluded); fail the release
        # if a new package was added but not exposed.
        run: |
          uv run python - <<'EOF'
          import tomllib
          from pathlib import Path

          package_dirs = sorted(
              p.name
              for p in Path("packages").iterdir()
              if (p / "pyproject.toml").is_file() and p.name not in {"rag-aio", "rag-ui"}
          )
          facade = tomllib.loads(Path("packages/rag-aio/pyproject.toml").read_text())
          extras = sorted(facade["project"]["optional-dependencies"])
          expected = sorted(package_dirs + ["all"])

          missing = sorted(set(expected) - set(extras))
          stale = sorted(set(extras) - set(expected))
          if missing or stale:
              raise SystemExit(
                  f"rag-aio extras out of sync with packages/\n"
                  f"  missing extras: {missing}\n  stale extras: {stale}"
              )
          print(f"OK: {len(extras)} extras cover {len(package_dirs)} workspace packages")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC); no API tokens
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
