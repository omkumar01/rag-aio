[project]
name = "rag-aio-workspace"
version = "0.1.0"
description = "rag-aio: asynchronous, modular, high-performance RAG platform (uv workspace root)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rag-core",
    "rag-observe",
    "rag-cache",
    "rag-db-handler",
    "rag-doc-handler",
    "rag-ocr",
    "rag-embedder",
    "rag-retrieval",
    "rag-rerank",
    "rag-query",
    "rag-context",
    "rag-llm-provider",
    "rag-generation",
    "rag-orchestrator",
    "rag-mass-inject",
    "rag-eval",
    "rag-ui",
    "rag-aio",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
rag-core = { workspace = true }
rag-observe = { workspace = true }
rag-cache = { workspace = true }
rag-db-handler = { workspace = true }
rag-doc-handler = { workspace = true }
rag-ocr = { workspace = true }
rag-embedder = { workspace = true }
rag-retrieval = { workspace = true }
rag-rerank = { workspace = true }
rag-query = { workspace = true }
rag-context = { workspace = true }
rag-llm-provider = { workspace = true }
rag-generation = { workspace = true }
rag-orchestrator = { workspace = true }
rag-mass-inject = { workspace = true }
rag-eval = { workspace = true }
rag-ui = { workspace = true }
rag-aio = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "ASYNC",    # async hygiene
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # long lines allowed in docstrings/comments; formatter handles code
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "SIM117"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = ["packages", "examples"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "fastembed.*", "fitz.*", "pymupdf.*", "docling.*", "sentence_transformers.*",
    "qdrant_client.*", "faiss.*", "streamlit.*", "docx.*", "openpyxl.*",
    "pptx.*", "extract_msg.*", "striprtf.*", "bs4.*", "lxml.*",
    "sqlalchemy.*", "aiosqlite.*", "asyncpg.*", "redis.*", "diskcache.*",
    "google.*", "anthropic.*", "tokenizers.*", "bm25s.*", "numpy.*",
    "pydantic_ai.*", "uvicorn.*", "opentelemetry.*", "email.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "unit: fast tests without external services",
    "integration: tests against real local backends",
    "e2e: end-to-end tests, may require local LM Studio/Qdrant",
    "benchmark: performance benchmarks, run explicitly via `pytest benchmarks -m benchmark`",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*"]
